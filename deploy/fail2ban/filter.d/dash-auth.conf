#=====================================================================
#  fail2ban 过滤器：从 Caddy 的访问日志里认出「登录被拒」的行
#---------------------------------------------------------------------
#  放到 /etc/fail2ban/filter.d/dash-auth.conf
#
#  为什么盯 401：登录网关在账号/口令/验证码任一不对时返回 401，而
#  Caddy 只负责转发。所以「401 的次数」就是「猜口令的次数」。
#
#  为什么不像一般教程那样匹配 4xx 全部：静态资源 404、短链 404 也很常见，
#  混进来会把自己人挡在门外。
#=====================================================================
[Definition]

# Caddy 2.4 的 JSON 日志里是 request.remote_addr（带端口），
# Caddy 2.5+ 改成了 request.remote_ip / remote_port。
# 两行都写上，升级 Caddy 不用改这个文件。
failregex = ^.*"remote_addr":"<HOST>:[0-9]+".*"status":401[,\}].*$
            ^.*"remote_ip":"<HOST>".*"status":401[,\}].*$

# 大屏自己每 30 秒读一次 health.json，探活脚本也会读；这些请求不该进计数
# （万一哪次探活写错成 401，会把监控机自己封掉 —— 真的踩过）
ignoreregex = ^.*"uri":"[^"]*health\.json.*$

# Caddy 的时间字段是浮点 epoch 秒
datepattern = "ts":{EPOCH}
