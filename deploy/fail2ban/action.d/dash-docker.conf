#=====================================================================
#  fail2ban 动作：把攻击者 IP 拉黑
#---------------------------------------------------------------------
#  放到 /etc/fail2ban/action.d/dash-docker.conf
#
#  ★ 关键点：如果你的 Caddy 跑在 Docker 里、端口是 `ports: - "8443:443"`
#    这种 publish 出来的，那么包走的是 FORWARD 链，不是 INPUT 链。
#    普通教程里 `iptables -I INPUT ...` 的封禁对这类流量**完全无效** ——
#    看着 fail2ban 日志说 banned，实际人家照样能连。
#    所以这里封在 DOCKER-USER 链（docker 自己的链，在 FORWARD 之前生效）。
#
#  ★ 另一个必须知道的事：封在 FORWARD 上，SSH 不受影响，你不会把自己关在
#    门外。反过来说，如果你把 SSH 的转发也走 docker，那另说。
#
#  如果你的 Caddy 直接装在宿主上（systemd 跑），用这个文件会封不上，
#  改用 fail2ban 自带的 iptables-multiport。
#=====================================================================
[Definition]

actionstart = iptables -w -N DOCKER-USER 2>/dev/null || true

actionstop  = iptables -w -N DOCKER-USER 2>/dev/null || true

actioncheck = iptables -w -n -L DOCKER-USER >/dev/null 2>&1

actionban   = iptables -w -I DOCKER-USER -s <ip> -j DROP

actionunban = iptables -w -D DOCKER-USER -s <ip> -j DROP || true

[Init]
